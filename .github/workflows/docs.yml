# Build and deploy the Avin documentation site to GitHub Pages.
#
#   Push to `dev`         → builds and deploys.
#   PR targeting `dev`    → builds only, as a check that every page renders.
#   workflow_dispatch     → builds and deploys whatever ref it is run on.
#
# The site is this repository's `docs/`: `site.toml`, the themes, the partials and static files, and
# the pages under `docs/content/`. It is built by juicer, which has no published launcher, so this
# workflow checks juicer's `stable` branch out beside the repository and runs it from its sbt project.
#
# The address the site is built for comes from the repository variable `DOCS_BASE_URL` (Settings →
# Secrets and variables → Actions → Variables). Until it is set the site is built for the Pages
# address, https://avin-lang.github.io/avin/. Once the custom domain's DNS points at GitHub Pages, set
# the variable to `https://avinlang.dev/` and the custom domain under Settings → Pages.

name: Docs

on:
  push:
    branches: ["dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A build per commit, so a queued build is never evicted by a later push; deploys share one group so
# two never publish out of order.
concurrency:
  group: "docs-${{ github.event_name == 'pull_request' && github.sha || 'deploy' }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.DOCS_BASE_URL || 'https://avin-lang.github.io/avin/' }}
    steps:
      - name: Check out avin
        uses: actions/checkout@v6
        with:
          path: avin

      - name: Check out juicer
        uses: actions/checkout@v6
        with:
          repository: edadma/juicer
          ref: stable
          path: juicer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('juicer/**/build.sbt', 'juicer/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # juicer's asset pipeline runs `sass` and `esbuild`; without them it falls back to the
      # committed static copies and skips fingerprinting.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install asset toolchain (sass + esbuild)
        run: npm install -g sass esbuild

      - name: Build the site
        working-directory: juicer
        run: >
          sbt 'juicerJVM/run build
          -s ${{ github.workspace }}/avin/docs
          -d ${{ github.workspace }}/_site
          -b ${{ env.BASE_URL }}'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
